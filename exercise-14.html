<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Ej.14</title>

    <link rel="stylesheet" href="css/exercise-14-style.css">
</head>

<body>

    <h1>Ejercicio 14</h1>

    <h2>Ejemplos de px, em y rem</h2>

    <p class="pixels">Este texto tiene un tamaño de 20px.</p>

    <div class="container">

        <div class="box">
            <p class="pixels">Este texto tiene un tamaño de 20px.</p>
        </div>

        <div class="box parent-em">
            <p class="pixels">Este texto tiene un tamaño de 20px.</p>
            <p class="em">Este texto tiene un tamaño de 1.5em.</p>
        </div>

        <div class="box">
            <p class="pixels">Este texto tiene un tamaño de 20px.</p>
            <p class="rem">Este texto tiene un tamaño de 1.5rem.</p>
        </div>

    </div>

</body>

</html>
