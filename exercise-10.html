<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Ej.10</title>

    <link rel="stylesheet" href="css/exercise-10-style.css">
</head>

<body>

    <h1>Ejercicio 10</h1>

    <h2>Ejemplo de display:none</h2>
    <a class="with-display-none" href="https://www.google.com">Ir a Google</a>

    <h2>Ejemplo de display:block</h2>
    <a class="with-display-block" href="https://www.google.com">Ir a Google</a>

    <h2>Ejemplo de visibility:hidden</h2>
    <a class="with-visibility-hidden" href="https://www.google.com">Ir a Google</a>

    <h2>Ejemplo de visibility:visible</h2>
    <a class="with-visibility-visible" href="https://www.google.com">Ir a Google</a>

    <p>Otra etiqueta inmediatamente detrás para mostrar que el elemento anterior ocupa un espacio</p>

</body>
