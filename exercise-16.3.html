<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Ej.16.3</title>

    <link rel="stylesheet" href="css/exercise-16.3-style.css">
</head>

<body>

    <main>
        <h1>Ejercicio 16.3</h1>

        <h2>Uso de flex-grow, flex-shrink y flex-basis</h2>

        <h2>flex-grow</h2>
        <div class="container grow">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <h2>flex-shrink</h2>
        <div class="container shrink">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <h2>flex-basis</h2>
        <div class="container basis">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </main>

</body>

</html>
